version: '3.8'

services:
  frontend:
    build:
      context: ./frontend  # Path to the frontend Dockerfile
    container_name: frontend
    ports:
      - "3000:80"  # Map port 80 in the container to port 3000 on the host
    depends_on:
      - backend  # Ensure backend starts before frontend
    networks:
      - app-network
    environment:
      REACT_APP_BACKEND_API_URL: http://backend:5000/api

  backend:
    build:
      context: ./api  # Path to the backend Dockerfile
    container_name: backend
    ports:
      - "5000:5000"  # Map port 4000 in the container to port 4000 on the host
    depends_on:
      - mongo  # Ensure database starts before backend
    networks:
      - app-network
    environment:
      MONGO_URI: mongodb://mongo:27017/3tier # Connect backend to MongoDB

  login-app:
    build:
      context: ./login-app  # Path to the login-app Dockerfile
    ports:
      - "4001:4001"  # Map port 4001 in the container to port 4001 on the host
    # depends_on:
    #   - frontend
    networks:
      - app-network
    environment:
      REACT_APP_FRONTEND_URL: localhost:3000


  mongo:
    image: mongo:7.0.16 # Use the official MongoDB image
    restart: always
    container_name: mongodb
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db  # Persistent storage for MongoDB

networks:
  app-network:
    driver: bridge  # Use a bridge network for communication between services

volumes:
  mongo-data:
    driver: local  # Persistent data volume for MongoDB
